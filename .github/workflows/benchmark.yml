name: benchmark

on:
  workflow_dispatch:
    inputs:
      submission:
        description: Path to submission.py
        required: true
        default: submissions/adamw/submission.py
  pull_request:
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve benchmark submission
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SUBMISSION: ${{ inputs.submission }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          submission="submissions/adamw/submission.py"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            submission="$MANUAL_SUBMISSION"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_submissions=$(git diff --name-only --diff-filter=AM \
              "$BASE_SHA" "$HEAD_SHA" -- 'submissions/*/submission.py')
            count=$(printf '%s\n' "$changed_submissions" | awk 'NF' | wc -l | tr -d ' ')
            if [[ "$count" -eq 1 ]]; then
              submission="$changed_submissions"
            elif [[ "$count" -gt 1 ]]; then
              echo "PR changes multiple submissions; benchmark them with workflow_dispatch." >&2
              exit 1
            fi
          fi

          if [[ ! -f "$submission" ]]; then
            echo "submission not found: $submission" >&2
            exit 1
          fi
          echo "Benchmark submission: $submission"
          printf 'SUBMISSION=%s\n' "$submission" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify runner
        run: |
          set -euxo pipefail
          uname -m
          sysctl -n machdep.cpu.brand_string || true
          python - <<'PY'
          import platform
          assert platform.machine() == "arm64", platform.machine()
          print("machine:", platform.machine())
          PY

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify PyTorch device
        run: |
          uv run python - <<'PY'
          import torch
          from run_eval import select_device

          print("torch:", torch.__version__)
          print("mps built:", torch.backends.mps.is_built())
          print("mps available:", torch.backends.mps.is_available())
          print("selected device:", select_device())
          PY

      - name: Run tests
        run: uv run python test_benchmark.py

      - name: Run benchmark
        run: |
          uv run python run_eval.py --require-arm64 --submission "$SUBMISSION" --results-json artifacts/result.json

      - name: Summarize
        if: always()
        run: |
          if [ -f artifacts/result.json ]; then
            {
              echo '## caffeine benchmark result'
              echo
              echo '```json'
              cat artifacts/result.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result
          path: artifacts/result.json
